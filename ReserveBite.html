<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReserveBite | Restaurant Management</title>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--ink:#182230;--muted:#687386;--line:#e4e9f1;--brand:#e65b35;--brand2:#ff8a54;--nav:#172235;--green:#16865b;--red:#c74343;--shadow:0 8px 26px #1722350b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--brand);color:white;font-weight:700}button:hover{filter:brightness(.96)}button.secondary{background:#eef1f6;color:#253247}button.danger{background:#fff0ef;color:var(--red)}button.small{padding:6px 9px;font-size:12px;border-radius:7px}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.sidebar{background:var(--nav);color:#fff;padding:24px 16px;display:flex;flex-direction:column;gap:24px}.logo{display:flex;gap:11px;align-items:center;padding:0 8px}.logo-mark{height:42px;width:42px;border-radius:13px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;font-size:23px}.logo strong{font-size:19px;letter-spacing:-.5px}.logo small{display:block;color:#aeb9c9;font-size:11px;margin-top:2px}.nav-label{font-size:10px;letter-spacing:1.6px;color:#8290a4;padding:0 12px;margin:3px 0}.nav{display:grid;gap:5px}.nav button{background:transparent;color:#cbd4e1;text-align:left;font-weight:600;display:flex;gap:12px;align-items:center;padding:11px 12px}.nav button.active,.nav button:hover{background:#29364a;color:#fff}.nav .ico{width:20px;text-align:center;font-size:16px}.side-bottom{margin-top:auto;border-top:1px solid #344156;padding:16px 8px;color:#aeb9c9;font-size:12px}.main{min-width:0}.topbar{height:76px;background:#ffffffd9;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:15px;position:sticky;top:0;z-index:4;backdrop-filter:blur(12px)}.topbar h2{margin:0;font-size:20px;letter-spacing:-.4px}.topbar p{margin:3px 0 0;color:var(--muted);font-size:12px}.top-actions{display:flex;align-items:center;gap:10px}.pill{background:#fff2eb;color:#b84220;border-radius:20px;padding:7px 11px;font-size:12px;font-weight:800}.content{padding:27px 30px 45px;max-width:1600px;margin:auto}.welcome{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:23px}.welcome h1{font-size:26px;letter-spacing:-.8px;margin:0 0 5px}.welcome p{color:var(--muted);margin:0}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.stat{padding:19px}.stat-head{display:flex;justify-content:space-between;color:var(--muted);font-weight:600;font-size:12px}.stat-icon{height:34px;width:34px;display:grid;place-items:center;border-radius:10px;background:#fff0e9;font-size:17px}.stat-value{font-size:29px;font-weight:800;letter-spacing:-1px;margin:13px 0 3px}.stat-foot{font-size:11px;color:var(--muted)}.two{grid-template-columns:1.15fr .85fr}.panel{padding:20px;margin-bottom:16px;min-width:0}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.panel h3{margin:0;font-size:16px;letter-spacing:-.25px}.panel-sub{color:var(--muted);font-size:12px;margin-top:4px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.field{display:grid;gap:6px;margin-bottom:13px}.field label{font-size:12px;font-weight:700;color:#526073}.field input,.field select,.field textarea,.toolbar input,.toolbar select{width:100%;border:1px solid #dce2eb;background:#fff;border-radius:9px;padding:10px 11px;outline:none;color:var(--ink)}.field input:focus,.field select:focus,.field textarea:focus,.toolbar input:focus{border-color:#ed967a;box-shadow:0 0 0 3px #e65b3517}.toolbar input{max-width:250px}.toolbar select{width:auto;min-width:130px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 13px}.form-grid .wide{grid-column:1/-1}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:11px}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:12px 13px;text-align:left;border-bottom:1px solid #edf0f5;font-size:12px}th{background:#f8f9fc;color:#677386;font-size:10px;text-transform:uppercase;letter-spacing:.7px}tr:last-child td{border-bottom:0}td strong{font-size:12px}.empty{text-align:center;padding:30px;color:var(--muted)}.badge{display:inline-flex;align-items:center;padding:4px 8px;border-radius:20px;background:#eef2f7;color:#4e5c70;font-size:10px;font-weight:800}.badge.green{background:#e7f7ef;color:#16784f}.badge.orange{background:#fff1e6;color:#b95c24}.badge.red{background:#ffeded;color:#b63434}.badge.blue{background:#eaf2ff;color:#2b60a8}.menu-cards{grid-template-columns:repeat(3,minmax(0,1fr))}.food-card{border:1px solid var(--line);border-radius:13px;padding:15px;background:#fff}.food-emoji{height:66px;border-radius:10px;background:linear-gradient(135deg,#fff2e8,#fff8f2);display:grid;place-items:center;font-size:34px;margin-bottom:12px}.food-card h4{margin:0 0 5px}.food-card p{margin:0 0 12px;color:var(--muted);font-size:12px}.food-price{font-weight:800;font-size:16px}.food-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px}.progress{height:7px;border-radius:9px;background:#edf0f5;overflow:hidden}.progress span{display:block;height:100%;background:var(--brand);border-radius:9px}.quick-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.quick-actions button{background:#fff;color:var(--ink);border:1px solid var(--line);text-align:left;padding:15px}.quick-actions button span{display:block;font-size:20px;margin-bottom:7px}.quick-actions button small{color:var(--muted);font-weight:500;display:block;margin-top:4px}.notice{border-radius:10px;padding:12px 14px;background:#fff6e9;color:#8b531b;font-size:12px;margin-bottom:15px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:15px}.tabs button{background:#eef1f6;color:#5a6678;padding:8px 12px;font-size:12px}.tabs button.active{background:var(--nav);color:#fff}.split{display:grid;grid-template-columns: minmax(270px,.8fr) minmax(0,1.2fr);gap:16px}.checkrow{display:flex;align-items:center;gap:8px;margin:7px 0}.checkrow input{width:auto}.muted{color:var(--muted)}.right{ text-align:right}.hidden{display:none!important}.footer-note{font-size:11px;color:var(--muted);margin-top:14px}.mobile-menu{display:none}.toast{position:fixed;right:24px;bottom:24px;background:#172235;color:#fff;padding:13px 17px;border-radius:12px;box-shadow:0 10px 30px #0002;z-index:10;max-width:340px}.login-chip{display:flex;align-items:center;gap:7px}.dot{height:8px;width:8px;border-radius:50%;background:#27b779}
@media(max-width:1050px){.app{grid-template-columns:205px 1fr}.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.menu-cards{grid-template-columns:repeat(2,1fr)}.quick-actions{grid-template-columns:repeat(2,1fr)}.content{padding:22px 18px}.topbar{padding:0 18px}}
@media(max-width:720px){.app{display:block}.sidebar{position:fixed;left:-260px;top:0;bottom:0;width:245px;z-index:8;transition:left .2s}.sidebar.open{left:0}.mobile-menu{display:inline-block;background:#eef1f6;color:#243247;padding:8px 11px}.topbar{height:68px;padding:0 13px}.topbar h2{font-size:17px}.topbar p,.top-actions .pill{display:none}.content{padding:18px 12px}.welcome{align-items:flex-start;flex-direction:column}.welcome h1{font-size:23px}.stats{gap:10px}.stat{padding:14px}.stat-value{font-size:24px}.panel{padding:14px}.menu-cards{grid-template-columns:1fr 1fr}.split{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}.toolbar input{max-width:100%;flex:1}.quick-actions{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="logo"><div class="logo-mark">🍽</div><div><strong>ReserveBite</strong><small>Restaurant operations</small></div></div>
  <div><div class="nav-label">WORKSPACE</div><nav class="nav" id="nav">
    <button class="active" data-page="dashboard"><span class="ico">▦</span>Overview</button>
    <button data-page="reservations"><span class="ico">▣</span>Reservations</button>
    <button data-page="waitlist"><span class="ico">◷</span>Waiting list</button>
    <button data-page="tables"><span class="ico">▤</span>Table management</button>
    <button data-page="menu"><span class="ico">☷</span>Menu & availability</button>
    <button data-page="orders"><span class="ico">🧾</span>Orders & kitchen</button>
    <button data-page="billing"><span class="ico">₹</span>Billing & payments</button>
    <button data-page="inventory"><span class="ico">▧</span>Inventory</button>
    <button data-page="coupons"><span class="ico">％</span>Coupons & offers</button>
    <button data-page="feedback"><span class="ico">☆</span>Feedback</button>
    <button data-page="staff"><span class="ico">♙</span>Staff & roles</button>
    <button data-page="reports"><span class="ico">▥</span>Reports & audit</button>
    <button data-page="settings"><span class="ico">⚙</span>Settings & data</button>
  </nav></div>
  <div class="side-bottom">ReserveBite Demo · Local browser storage<br><span style="color:#e9a58e">●</span> Data stays on this device</div>
</aside>
<main class="main">
<header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="mobile-menu" id="mobileMenu">☰</button><div><h2 id="pageTitle">Overview</h2><p id="pageDesc">Your restaurant at a glance</p></div></div><div class="top-actions"><span class="pill">● SYSTEM ONLINE</span><div class="login-chip"><span class="dot"></span><strong id="activeRole">Manager</strong></div><select id="roleSwitch" aria-label="Switch role" style="border:1px solid var(--line);border-radius:9px;padding:8px;background:white"><option>Manager</option><option>Waiter</option><option>Chef</option></select></div></header>
<div class="content" id="content"></div>
</main>
</div>
<div id="toast" class="toast hidden"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const today=()=>new Date().toISOString().slice(0,10);
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const uid=(prefix,arr)=>prefix+(Math.max(0,...arr.map(x=>Number(String(x.id||'').replace(/\D/g,''))||0))+1);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const defaults={
 customers:[{id:'C1001',name:'Aarav Sharma',phone:'9876543210',email:'aarav@example.com'},{id:'C1002',name:'Priya Reddy',phone:'9123456780',email:'priya@example.com'}],
 tables:[{id:'T1',no:'01',capacity:2,status:'AVAILABLE'},{id:'T2',no:'02',capacity:2,status:'AVAILABLE'},{id:'T3',no:'03',capacity:4,status:'AVAILABLE'},{id:'T4',no:'04',capacity:4,status:'AVAILABLE'},{id:'T5',no:'05',capacity:6,status:'AVAILABLE'},{id:'T6',no:'06',capacity:8,status:'AVAILABLE'}],
 reservations:[],waitlist:[],
 categories:['Starters','Main Course','Rice & Biryani','Desserts','Beverages'],
 menu:[
 {id:'M1',name:'Paneer Tikka',category:'Starters',price:220,available:true,emoji:'🍢'},
 {id:'M2',name:'Crispy Corn',category:'Starters',price:180,available:true,emoji:'🌽'},
 {id:'M3',name:'Veg Biryani',category:'Rice & Biryani',price:320,available:true,emoji:'🍛'},
 {id:'M4',name:'Paneer Butter Masala',category:'Main Course',price:290,available:true,emoji:'🥘'},
 {id:'M5',name:'Butter Naan',category:'Main Course',price:55,available:true,emoji:'🫓'},
 {id:'M6',name:'Gulab Jamun',category:'Desserts',price:100,available:true,emoji:'🍮'},
 {id:'M7',name:'Fresh Lime Soda',category:'Beverages',price:80,available:true,emoji:'🍹'},
 {id:'M8',name:'Masala Dosa',category:'Main Course',price:140,available:true,emoji:'🥞'},
 {id:'M9',name:'Filter Coffee',category:'Beverages',price:50,available:true,emoji:'☕'}],
 ingredients:[{id:'I1',name:'Paneer',unit:'kg',stock:8,reorder:2},{id:'I2',name:'Rice',unit:'kg',stock:15,reorder:4},{id:'I3',name:'Vegetables',unit:'kg',stock:12,reorder:3},{id:'I4',name:'Cream',unit:'L',stock:5,reorder:1},{id:'I5',name:'Flour',unit:'kg',stock:10,reorder:3}],
 recipes:[{itemId:'M1',ingredientId:'I1',qty:.15},{itemId:'M3',ingredientId:'I2',qty:.25},{itemId:'M3',ingredientId:'I3',qty:.1},{itemId:'M4',ingredientId:'I1',qty:.15},{itemId:'M4',ingredientId:'I4',qty:.08},{itemId:'M5',ingredientId:'I5',qty:.12}],
 staff:[{id:'S1',name:'Ananya Rao',role:'Manager',shift:'Morning'},{id:'S2',name:'Rahul Kumar',role:'Waiter',shift:'Evening'},{id:'S3',name:'Meera Das',role:'Chef',shift:'Morning'}],
 orders:[],bills:[],payments:[],coupons:[{id:'CP1',code:'WELCOME10',type:'percent',value:10,min:300,active:true},{id:'CP2',code:'BITE50',type:'flat',value:50,min:500,active:true}],feedback:[],audit:[],settings:{gst:5,service:5,restaurant:'ReserveBite Restaurant',currency:'INR'}
};
let db, page='dashboard', role='Manager', cart={}, selectedOrder=null;
function load(){try{db=JSON.parse(localStorage.getItem('reservebite_db'))||structuredClone(defaults)}catch(e){db=structuredClone(defaults)};Object.keys(defaults).forEach(k=>{if(!db[k])db[k]=structuredClone(defaults[k])})}
function save(){localStorage.setItem('reservebite_db',JSON.stringify(db))}
function log(action,detail){db.audit.unshift({id:'A'+Date.now(),time:new Date().toLocaleString(),role,action,detail});db.audit=db.audit.slice(0,300);save()}
function toast(msg){let t=$('#toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.add('hidden'),2600)}
function setPage(p){page=p;$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#sidebar').classList.remove('open');render()}
function head(title,desc){$('#pageTitle').textContent=title;$('#pageDesc').textContent=desc}
function panel(title,body,sub=''){return `<section class="panel"><div class="panel-head"><div><h3>${title}</h3>${sub?`<div class="panel-sub">${sub}</div>`:''}</div></div>${body}</section>`}
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${headers.length}" class="empty">No records yet</td></tr>`}</tbody></table></div>`}
function badge(s){let v=String(s||'').toUpperCase(),c=['AVAILABLE','PAID','READY','SERVED','DONE','ACTIVE'].includes(v)?'green':['BOOKED','PLACED','PREPARING','PENDING','WAITING'].includes(v)?'orange':['CANCELLED','LOW STOCK','UNPAID'].includes(v)?'red':['OCCUPIED','SEATED'].includes(v)?'blue':'';return `<span class="badge ${c}">${esc(s)}</span>`}
function stat(label,val,icon,foot){return `<div class="stat"><div class="stat-head">${label}<span class="stat-icon">${icon}</span></div><div class="stat-value">${val}</div><div class="stat-foot">${foot}</div></div>`}
function options(items,selected,lab=x=>x){return items.map(x=>`<option value="${esc(x)}" ${String(x)===String(selected)?'selected':''}>${esc(lab(x))}</option>`).join('')}
function noOverlap(tableId,start,end,ignore=''){return !db.reservations.some(r=>r.id!==ignore&&r.tableId===tableId&&['BOOKED','SEATED'].includes(r.status)&&r.start<end&&r.end>start)}
function fitTable(party,start,end,ignore=''){return db.tables.filter(t=>Number(t.capacity)>=Number(party)&&noOverlap(t.id,start,end,ignore)).sort((a,b)=>a.capacity-b.capacity)[0]}
function customerFormOptions(){return db.customers.map(c=>`<option value="${c.id}">${esc(c.name)} · ${esc(c.phone)}</option>`).join('')}
function menuOptionOptions(){return db.menu.filter(m=>m.available).map(m=>`<option value="${m.id}">${esc(m.name)} — ${money(m.price)}</option>`).join('')}
function render(){const c=$('#content');if(!allowed(page,role)){c.innerHTML=`<section class="panel"><h3>Access restricted</h3><p class="muted">The ${role} role does not have permission to open this section. Switch roles to continue.</p></section>`;return}
const pages={dashboard:dashboardPage,reservations:reservationsPage,waitlist:waitlistPage,tables:tablesPage,menu:menuPage,orders:ordersPage,billing:billingPage,inventory:inventoryPage,coupons:couponsPage,feedback:feedbackPage,staff:staffPage,reports:reportsPage,settings:settingsPage};
c.innerHTML=(pages[page]||dashboardPage)();bindPage()}
function allowed(p,r){if(r==='Manager')return true;if(r==='Waiter')return ['dashboard','reservations','waitlist','tables','menu','orders','billing','feedback'].includes(p);if(r==='Chef')return ['dashboard','menu','orders','inventory'].includes(p);return true}
function dashboardPage(){head('Overview','Your restaurant at a glance');let todayRes=db.reservations.filter(r=>r.start.slice(0,10)===today()&&r.status!=='CANCELLED'),openOrders=db.orders.filter(o=>!['SERVED','CANCELLED'].includes(o.status)),rev=db.payments.filter(p=>p.time.slice(0,10)===today()).reduce((a,p)=>a+p.amount,0),available=db.tables.filter(t=>t.status==='AVAILABLE').length;
return `<div class="welcome"><div><h1>Good ${new Date().getHours()<12?'morning':new Date().getHours()<18?'afternoon':'evening'} 👋</h1><p>Here is what is happening at ${esc(db.settings.restaurant)} today.</p></div><button data-go="reservations">＋ New reservation</button></div><div class="grid stats">${stat("Today's reservations",todayRes.length,'▣','Bookings for today')}${stat('Available tables',available,'▤',`of ${db.tables.length} total tables`)}${stat('Open kitchen orders',openOrders.length,'🧾','Not yet served')}${stat("Today's revenue",money(rev),'₹','Successful payments')}</div>
<div class="quick-actions" style="margin-bottom:18px"><button data-go="reservations"><span>📅</span>Book a table<small>Create guest reservation</small></button><button data-go="orders"><span>🍽️</span>Place an order<small>Send dishes to kitchen</small></button><button data-go="billing"><span>💳</span>Generate bill<small>Apply offers and pay</small></button><button data-go="reports"><span>📊</span>View reports<small>Revenue and popular dishes</small></button></div>
<div class="grid two">${panel('Upcoming reservations',table(['Guest','Date & time','Party','Table','Status'],db.reservations.filter(r=>r.status==='BOOKED'||r.status==='SEATED').sort((a,b)=>a.start.localeCompare(b.start)).slice(0,5).map(r=>`<tr><td><strong>${esc(db.customers.find(c=>c.id===r.customerId)?.name||'Guest')}</strong></td><td>${esc(r.start.replace('T',' '))}</td><td>${r.party}</td><td>${esc(db.tables.find(t=>t.id===r.tableId)?.no||'—')}</td><td>${badge(r.status)}</td></tr>`)),'Latest active bookings')}${panel('Kitchen queue',table(['Order','Table','Items','Status'],openOrders.slice(0,6).map(o=>`<tr><td><strong>${o.id}</strong></td><td>${esc(db.tables.find(t=>t.id===o.tableId)?.no||'—')}</td><td>${o.items.reduce((n,i)=>n+i.qty,0)} items</td><td>${badge(o.status)}</td></tr>`)),'Live order progress')}</div>`}
function reservationsPage(){head('Reservations','Book tables, manage time slots and prevent double bookings');return `<div class="split"><section class="panel"><div class="panel-head"><div><h3>Create reservation</h3><div class="panel-sub">Best-fit table allocation checks time overlaps</div></div></div><form id="reservationForm"><div class="field"><label>Existing guest</label><select name="customer" required>${customerFormOptions()}</select></div><div class="field"><label>Or add a new guest</label><input name="newName" placeholder="Guest full name (optional)"></div><div class="form-grid"><div class="field"><label>Phone</label><input name="phone" placeholder="10-digit phone"></div><div class="field"><label>Party size</label><input name="party" type="number" min="1" max="20" value="2" required></div><div class="field"><label>Start time</label><input name="start" type="datetime-local" value="${today()}T19:00" required></div><div class="field"><label>Duration</label><select name="duration"><option value="60">1 hour</option><option value="90" selected>1.5 hours</option><option value="120">2 hours</option></select></div></div><div class="field"><label>Special request</label><input name="notes" placeholder="Window seat, birthday, allergies..."></div><button type="submit" class="block">Find table & reserve</button></form><div class="footer-note">A reservation is only saved if a suitable table is free for the full time slot.</div></section><section class="panel"><div class="panel-head"><div><h3>Reservation schedule</h3><div class="panel-sub">Search, seat guests or cancel a booking</div></div></div><div class="toolbar"><input id="resSearch" placeholder="Search guest or booking ID"><select id="resFilter"><option value="ALL">All statuses</option>${options(['BOOKED','SEATED','DONE','CANCELLED'])}</select></div><div id="resTable">${reservationRows()}</div></section></div>`}
function reservationRows(){let q=($('#resSearch')?.value||'').toLowerCase(),f=$('#resFilter')?.value||'ALL';return table(['Booking','Guest','Date & time','Party','Table','Status','Actions'],db.reservations.filter(r=>(f==='ALL'||r.status===f)&&(`${r.id} ${db.customers.find(c=>c.id===r.customerId)?.name||''}`).toLowerCase().includes(q)).sort((a,b)=>a.start.localeCompare(b.start)).map(r=>`<tr><td><strong>${r.id}</strong></td><td>${esc(db.customers.find(c=>c.id===r.customerId)?.name||'—')}</td><td>${esc(r.start.replace('T',' '))}</td><td>${r.party}</td><td>${esc(db.tables.find(t=>t.id===r.tableId)?.no||'—')}</td><td>${badge(r.status)}</td><td>${r.status==='BOOKED'?`<button class="small" data-seat="${r.id}">Seat</button> <button class="small danger" data-cancelres="${r.id}">Cancel</button>`:r.status==='SEATED'?`<button class="small secondary" data-finishres="${r.id}">Finish</button>`:'—'}</td></tr>`))}
function waitlistPage(){head('Waiting list','Queue walk-in guests when no table is free');return `<div class="split"><section class="panel"><h3>Add guest to waiting list</h3><p class="panel-sub">Record the party and contact number; seat them when a table opens.</p><form id="waitForm"><div class="field"><label>Guest name</label><input name="name" required></div><div class="field"><label>Phone</label><input name="phone" required></div><div class="field"><label>Party size</label><input name="party" type="number" min="1" max="20" value="2" required></div><div class="field"><label>Notes</label><input name="notes" placeholder="Optional"></div><button>Add to queue</button></form></section><section class="panel"><h3>Waiting guests</h3><p class="panel-sub">First-in, first-served queue</p>${table(['Guest','Phone','Party','Added','Status','Action'],db.waitlist.filter(w=>w.status==='WAITING').map(w=>`<tr><td><strong>${esc(w.name)}</strong></td><td>${esc(w.phone)}</td><td>${w.party}</td><td>${esc(w.time)}</td><td>${badge(w.status)}</td><td><button class="small" data-seatwait="${w.id}">Find table</button> <button class="small danger" data-removewait="${w.id}">Remove</button></td></tr>`))}</section></div>`}
function tablesPage(){head('Table management','Configure capacity and monitor table status');return `<div class="welcome"><div><h1>Dining floor</h1><p>Pick a table to change its operational status. Reservation conflicts are checked separately.</p></div><button data-action="addtable">＋ Add table</button></div><div class="grid menu-cards">${db.tables.map(t=>`<div class="food-card"><div class="food-emoji">${t.status==='OCCUPIED'?'🍽️':'🪑'}</div><h4>Table ${esc(t.no)}</h4><p>Capacity: ${t.capacity} guests</p><div class="food-bottom"><span>${badge(t.status)}</span><select data-table-status="${t.id}" style="border:1px solid var(--line);padding:7px;border-radius:8px"><option ${t.status==='AVAILABLE'?'selected':''}>AVAILABLE</option><option ${t.status==='OCCUPIED'?'selected':''}>OCCUPIED</option><option ${t.status==='MAINTENANCE'?'selected':''}>MAINTENANCE</option></select></div></div>`).join('')}</div><section class="panel" style="margin-top:16px"><h3>Table inventory</h3><div class="footer-note">Use reservations for time-slot allocation. Manual table status is for floor operations.</div>${table(['Table ID','Number','Capacity','Status','Action'],db.tables.map(t=>`<tr><td>${t.id}</td><td>Table ${esc(t.no)}</td><td>${t.capacity}</td><td>${badge(t.status)}</td><td><button class="small danger" data-deletetable="${t.id}">Remove</button></td></tr>`))}</section>`}
function menuPage(){head('Menu & availability','Manage categories, prices and dish availability');return `<div class="welcome"><div><h1>Restaurant menu</h1><p>Keep menu prices current and hide unavailable dishes.</p></div>${role==='Manager'?'<button data-action="addmenu">＋ Add dish</button>':''}</div><div class="toolbar"><input id="menuSearch" placeholder="Search dishes"><select id="menuCategory"><option value="ALL">All categories</option>${options(db.categories)}</select><select id="menuAvail"><option value="ALL">All availability</option><option value="yes">Available</option><option value="no">Unavailable</option></select></div><div class="grid menu-cards" id="menuCards">${menuCards()}</div>`}
function menuCards(){let q=($('#menuSearch')?.value||'').toLowerCase(),cat=$('#menuCategory')?.value||'ALL',av=$('#menuAvail')?.value||'ALL';let items=db.menu.filter(m=>(m.name+' '+m.category).toLowerCase().includes(q)&&(cat==='ALL'||m.category===cat)&&(av==='ALL'||(av==='yes')===m.available));return items.length?items.map(m=>`<div class="food-card"><div class="food-emoji">${m.emoji||'🍽️'}</div><h4>${esc(m.name)}</h4><p>${esc(m.category)} · ${m.available?'<span style="color:var(--green)">Available</span>':'<span style="color:var(--red)">Unavailable</span>'}</p><div class="food-bottom"><span class="food-price">${money(m.price)}</span><div>${role==='Manager'?`<button class="small secondary" data-editmenu="${m.id}">Edit</button>`:''} <button class="small ${m.available?'danger':''}" data-togglemenu="${m.id}">${m.available?'Hide':'Enable'}</button></div></div></div>`).join(''):'<div class="empty">No menu items match your filters.</div>'}
function ordersPage(){head('Orders & kitchen','Create orders and move them through the kitchen workflow');return `<div class="split"><section class="panel"><h3>Create food order</h3><p class="panel-sub">Choose a table, add dishes and send the order to the kitchen.</p><form id="orderForm"><div class="field"><label>Table</label><select name="table" required>${options(db.tables.map(t=>t.id),db.tables.find(t=>t.status==='OCCUPIED')?.id||db.tables[0]?.id,id=>{let t=db.tables.find(x=>x.id===id);return `Table ${t?.no} (${t?.status})`})}</select></div><div class="field"><label>Reservation (optional)</label><select name="reservation"><option value="">Walk-in / no reservation</option>${db.reservations.filter(r=>['BOOKED','SEATED'].includes(r.status)).map(r=>`<option value="${r.id}">${r.id} · ${esc(db.customers.find(c=>c.id===r.customerId)?.name||'Guest')}</option>`).join('')}</select></div><div class="field"><label>Staff / waiter</label><select name="staff">${options(db.staff.filter(s=>s.role!=='Chef').map(s=>s.id),db.staff.find(s=>s.role==='Waiter')?.id||'',id=>db.staff.find(s=>s.id===id)?.name||id)}</select></div><div class="field"><label>Dish</label><select id="orderDish">${menuOptionOptions()}</select></div><div class="form-grid"><div class="field"><label>Quantity</label><input id="orderQty" type="number" min="1" max="30" value="1"></div><div class="field" style="align-self:end"><button type="button" class="secondary" id="addCart">＋ Add dish</button></div></div><div id="cartPreview" class="notice">No dishes added yet.</div><button type="submit">Place order</button></form></section><section class="panel"><h3>Kitchen queue</h3><p class="panel-sub">Track PLACED → PREPARING → READY → SERVED</p><div class="toolbar"><select id="orderFilter"><option value="ALL">All statuses</option>${options(['PLACED','PREPARING','READY','SERVED','CANCELLED'])}</select></div><div id="orderRows">${orderRows()}</div></section></div>`}
function orderRows(){let f=$('#orderFilter')?.value||'ALL';return table(['Order','Table','Dishes','Amount','Status','Update'],db.orders.filter(o=>f==='ALL'||o.status===f).slice().reverse().map(o=>`<tr><td><strong>${o.id}</strong><div class="muted">${esc(o.time)}</div></td><td>${esc(db.tables.find(t=>t.id===o.tableId)?.no||'—')}</td><td>${o.items.map(i=>`${esc(db.menu.find(m=>m.id===i.itemId)?.name||'Dish')} × ${i.qty}`).join('<br>')}</td><td>${money(o.items.reduce((s,i)=>s+i.qty*i.price,0))}</td><td>${badge(o.status)}</td><td><select data-order-status="${o.id}" style="padding:7px;border:1px solid var(--line);border-radius:7px">${options(['PLACED','PREPARING','READY','SERVED','CANCELLED'],o.status)}</select><div style="margin-top:5px"><button class="small secondary" data-billorder="${o.id}">Bill</button></div></td></tr>`))}
function billingPage(){head('Billing & payments','Calculate subtotal, GST, service charge, discounts and payment');return `<div class="split"><section class="panel"><h3>Generate bill</h3><p class="panel-sub">Select an order that has not been paid.</p><form id="billForm"><div class="field"><label>Order</label><select name="order" id="billOrder" required>${options(db.orders.filter(o=>!db.bills.some(b=>b.orderId===o.id&&b.status==='PAID')).map(o=>o.id),db.orders.find(o=>!db.bills.some(b=>b.orderId===o.id&&b.status==='PAID'))?.id,id=>{let o=db.orders.find(x=>x.id===id);return `${id} · Table ${db.tables.find(t=>t.id===o?.tableId)?.no||'?'} · ${money(o?.items.reduce((s,i)=>s+i.qty*i.price,0))}`})}</select></div><div class="field"><label>Coupon code (optional)</label><input name="coupon" placeholder="e.g. WELCOME10"></div><div class="notice" id="billPreview">Choose an order to preview the bill.</div><button type="submit">Calculate & create bill</button></form></section><section class="panel"><h3>Bills & payment history</h3><p class="panel-sub">Collect payment by cash, UPI or card.</p>${table(['Bill','Order','Subtotal','Discount','Total','Status','Payment'],db.bills.slice().reverse().map(b=>`<tr><td><strong>${b.id}</strong></td><td>${b.orderId}</td><td>${money(b.subtotal)}</td><td>${money(b.discount)}</td><td><strong>${money(b.total)}</strong></td><td>${badge(b.status)}</td><td>${b.status==='PAID'?`${badge(b.mode)}<br>${esc(b.paidAt||'')}`:`<select id="paymode-${b.id}" style="padding:6px;border:1px solid var(--line);border-radius:7px"><option>UPI</option><option>Cash</option><option>Card</option></select><button class="small" data-paybill="${b.id}">Pay</button>`}</td></tr>`))}</section></div>`}
function inventoryPage(){head('Inventory','Track ingredients, recipe usage and low-stock alerts');return `<div class="welcome"><div><h1>Ingredient stock</h1><p>Order placement deducts ingredients linked to recipes.</p></div><button data-action="addingredient">＋ Add ingredient</button></div><div class="grid stats">${stat('Ingredients tracked',db.ingredients.length,'▧','Stock items')}${stat('Low-stock items',db.ingredients.filter(i=>i.stock<=i.reorder).length,'⚠','At or below reorder level')}${stat('Menu recipes',db.recipes.length,'♨','Recipe links')}${stat('Menu dishes',db.menu.length,'☷','All dishes')}</div><section class="panel"><h3>Stock ledger</h3>${table(['Ingredient','On hand','Unit','Reorder level','Status','Actions'],db.ingredients.map(i=>`<tr><td><strong>${esc(i.name)}</strong></td><td>${i.stock}</td><td>${esc(i.unit)}</td><td>${i.reorder}</td><td>${i.stock<=i.reorder?badge('LOW STOCK'):badge('IN STOCK')}</td><td><button class="small secondary" data-restock="${i.id}">Restock +</button> <button class="small secondary" data-recipe="${i.id}">Recipe links</button></td></tr>`))}</section><section class="panel"><h3>Recipe mapping</h3>${table(['Dish','Ingredient','Quantity per dish'],db.recipes.map(r=>`<tr><td>${esc(db.menu.find(m=>m.id===r.itemId)?.name||r.itemId)}</td><td>${esc(db.ingredients.find(i=>i.id===r.ingredientId)?.name||r.ingredientId)}</td><td>${r.qty} ${esc(db.ingredients.find(i=>i.id===r.ingredientId)?.unit||'units')}</td></tr>`))}<div class="footer-note">Demo recipe quantities are sample estimates. Update them to match your kitchen's actual recipes.</div></section>`}
function couponsPage(){head('Coupons & offers','Create and manage discount codes');return `<div class="split"><section class="panel"><h3>Create coupon</h3><form id="couponForm"><div class="field"><label>Coupon code</label><input name="code" required placeholder="e.g. WEEKEND15"></div><div class="form-grid"><div class="field"><label>Discount type</label><select name="type"><option value="percent">Percentage (%)</option><option value="flat">Flat amount (₹)</option></select></div><div class="field"><label>Value</label><input name="value" type="number" min="1" required></div></div><div class="field"><label>Minimum subtotal (₹)</label><input name="min" type="number" min="0" value="0"></div><button>Create coupon</button></form></section><section class="panel"><h3>Active offers</h3>${table(['Code','Discount','Minimum bill','Status','Action'],db.coupons.map(c=>`<tr><td><strong>${esc(c.code)}</strong></td><td>${c.type==='percent'?`${c.value}%`:`${money(c.value)} off`}</td><td>${money(c.min)}</td><td>${badge(c.active?'ACTIVE':'INACTIVE')}</td><td><button class="small ${c.active?'danger':'secondary'}" data-coupon-toggle="${c.id}">${c.active?'Disable':'Enable'}</button></td></tr>`))}</section></div>`}
function feedbackPage(){head('Guest feedback','Collect ratings after payment and review service quality');return `<div class="split"><section class="panel"><h3>Record feedback</h3><form id="feedbackForm"><div class="field"><label>Guest name</label><input name="name" required></div><div class="field"><label>Order (optional)</label><select name="order"><option value="">Not linked</option>${options(db.orders.map(o=>o.id),'',id=>id)}</select></div><div class="field"><label>Rating</label><select name="rating"><option value="5">★★★★★ — Excellent</option><option value="4">★★★★☆ — Good</option><option value="3">★★★☆☆ — Average</option><option value="2">★★☆☆☆ — Poor</option><option value="1">★☆☆☆☆ — Very poor</option></select></div><div class="field"><label>Comments</label><textarea name="comment" rows="3" placeholder="What went well? What can we improve?"></textarea></div><button>Save feedback</button></form></section><section class="panel"><h3>Guest reviews</h3><div class="grid">${db.feedback.slice().reverse().map(f=>`<div class="food-card"><div class="food-bottom"><strong>${esc(f.name)}</strong><span style="color:#e69a19">${'★'.repeat(f.rating)}${'☆'.repeat(5-f.rating)}</span></div><p style="margin-top:9px">${esc(f.comment||'No written comment.')}</p><small class="muted">${esc(f.time)} ${f.order?'· '+esc(f.order):''}</small></div>`).join('')||'<div class="empty">No feedback yet.</div>'}</div></section></div>`}
function staffPage(){head('Staff & roles','Manage staff records and demonstrate role-based access');return `<div class="split"><section class="panel"><h3>Add staff member</h3><form id="staffForm"><div class="field"><label>Full name</label><input name="name" required></div><div class="field"><label>Role</label><select name="role"><option>Manager</option><option>Waiter</option><option>Chef</option></select></div><div class="field"><label>Shift</label><select name="shift"><option>Morning</option><option>Afternoon</option><option>Evening</option><option>Night</option></select></div><button>Add staff</button></form><div class="notice" style="margin-top:15px">Use the role selector in the top bar to preview each role's access. This is a UI demonstration, not secure authentication.</div></section><section class="panel"><h3>Staff directory</h3>${table(['Staff ID','Name','Role','Shift','Action'],db.staff.map(s=>`<tr><td>${s.id}</td><td><strong>${esc(s.name)}</strong></td><td>${badge(s.role)}</td><td>${esc(s.shift)}</td><td><button class="small danger" data-deletestaff="${s.id}">Remove</button></td></tr>`))}</section></div>`}
function reportsPage(){head('Reports & audit','Review sales, popular dishes, peak hours and important actions');let paid=db.bills.filter(b=>b.status==='PAID'),rev=paid.reduce((s,b)=>s+b.total,0),dishTotals={};db.orders.forEach(o=>o.items.forEach(i=>dishTotals[i.itemId]=(dishTotals[i.itemId]||0)+i.qty));let top=Object.entries(dishTotals).sort((a,b)=>b[1]-a[1]).slice(0,5),daily={};db.payments.forEach(p=>daily[p.time.slice(0,10)]=(daily[p.time.slice(0,10)]||0)+p.amount);let max=Math.max(1,...Object.values(daily));let hours={};db.reservations.filter(r=>r.status!=='CANCELLED').forEach(r=>{let h=r.start.slice(11,13)||'--';hours[h]=(hours[h]||0)+1});return `<div class="grid stats">${stat('Paid bills',paid.length,'✓','Completed transactions')}${stat('Total revenue',money(rev),'₹','Across paid bills')}${stat('Average bill',money(paid.length?rev/paid.length:0),'∅','Average paid ticket')}${stat('Guest ratings',db.feedback.length,'☆','Average '+(db.feedback.length?(db.feedback.reduce((s,f)=>s+f.rating,0)/db.feedback.length).toFixed(1):'—')+'/5')}</div><div class="grid two">${panel('Daily revenue',Object.keys(daily).length?Object.entries(daily).sort((a,b)=>a[0].localeCompare(b[0])).slice(-7).map(([d,v])=>`<div style="margin:15px 0"><div class="food-bottom"><span>${esc(d)}</span><strong>${money(v)}</strong></div><div class="progress" style="margin-top:7px"><span style="width:${v/max*100}%"></span></div></div>`).join(''):'<div class="empty">Revenue appears after payments are recorded.</div>')}${panel('Top-selling dishes',top.length?top.map(([id,n],i)=>`<div class="food-bottom" style="padding:13px 0;border-bottom:1px solid var(--line)"><span><strong>${i+1}.</strong> ${esc(db.menu.find(m=>m.id===id)?.name||'Removed dish')}</span><strong>${n} sold</strong></div>`).join(''):'<div class="empty">Place orders to see popular dishes.</div>')}</div><div class="grid two">${panel('Peak reservation hours',Object.keys(hours).length?Object.entries(hours).sort((a,b)=>b[1]-a[1]).map(([h,n])=>`<div style="margin:12px 0"><div class="food-bottom"><span>${h==='--'?'Unknown':h+':00'} hour</span><strong>${n} booking(s)</strong></div><div class="progress" style="margin-top:6px"><span style="width:${n/Math.max(...Object.values(hours))*100}%"></span></div></div>`).join(''):'<div class="empty">No reservations recorded.</div>')}${panel('Low-stock ingredients',db.ingredients.filter(i=>i.stock<=i.reorder).map(i=>`<div class="food-bottom" style="padding:10px 0;border-bottom:1px solid var(--line)"><span>${esc(i.name)} <small class="muted">(${i.stock} ${esc(i.unit)} left)</small></span>${badge('LOW STOCK')}</div>`).join('')||'<div class="empty">All tracked ingredients are above reorder level.</div>')}</div><section class="panel"><div class="panel-head"><div><h3>Audit log</h3><div class="panel-sub">Recent actions within this browser</div></div><button class="secondary" id="exportAudit">Export CSV</button></div>${table(['Time','Role','Action','Details'],db.audit.slice(0,30).map(a=>`<tr><td>${esc(a.time)}</td><td>${esc(a.role)}</td><td>${esc(a.action)}</td><td>${esc(a.detail)}</td></tr>`))}</section>`}
function settingsPage(){head('Settings & data','Configure billing rates and back up your demo records');return `<div class="grid two"><section class="panel"><h3>Restaurant settings</h3><form id="settingsForm"><div class="field"><label>Restaurant name</label><input name="restaurant" value="${esc(db.settings.restaurant)}" required></div><div class="form-grid"><div class="field"><label>GST (%)</label><input name="gst" type="number" min="0" max="30" step=".1" value="${db.settings.gst}"></div><div class="field"><label>Service charge (%)</label><input name="service" type="number" min="0" max="30" step=".1" value="${db.settings.service}"></div></div><button>Save settings</button></form><div class="footer-note">GST/service-charge values are configurable demo assumptions; apply the rates appropriate to your business and local rules.</div></section><section class="panel"><h3>Backup & restore</h3><p class="muted">Export all current data as JSON or restore a previously exported ReserveBite backup.</p><div class="toolbar"><button id="exportData">⬇ Export backup</button><label class="secondary" style="padding:10px 13px;border-radius:10px;cursor:pointer;font-weight:700"><input type="file" id="importData" accept=".json,application/json" hidden>⬆ Import backup</label></div><button class="danger" id="resetData">Reset demo data</button><div class="notice" style="margin-top:15px">Data is stored in this browser's localStorage. Clearing browser data removes it. This single-file demo does not connect to MySQL or provide server-side multi-user synchronization.</div></section></div><section class="panel"><h3>Included modules</h3><div class="grid menu-cards">${[['📅','Reservations','Best-fit table allocation, time overlap checks, seating and cancellation'],['🍽️','Orders & kitchen','Order items, waiter association and status workflow'],['₹','Billing','GST, service charge, coupons, payment modes and totals'],['🥕','Inventory','Ingredient stock, recipe mapping and low-stock alerts'],['🎟️','Coupons','Percentage or flat discounts with minimum subtotal'],['⭐','Feedback','Guest ratings and comments'],['🛡️','Roles & audit','Manager/waiter/chef UI permissions and action history'],['📈','Reports','Revenue, popular dishes, peak hours and stock alerts']].map(a=>`<div class="food-card"><div style="font-size:24px;margin-bottom:8px">${a[0]}</div><h4>${a[1]}</h4><p>${a[2]}</p></div>`).join('')}</div></section>`}
function bindPage(){
$$('[data-go]').forEach(b=>b.onclick=()=>setPage(b.dataset.go));
$('#mobileMenu').onclick=()=>$('#sidebar').classList.toggle('open');
if($('#reservationForm'))$('#reservationForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),name=f.get('newName').trim(),cid=f.get('customer');if(name){let c={id:uid('C',db.customers),name,phone:f.get('phone'),email:''};db.customers.push(c);cid=c.id}let start=f.get('start'),end=new Date(new Date(start).getTime()+Number(f.get('duration'))*60000).toISOString().slice(0,16),party=Number(f.get('party'));let t=fitTable(party,start,end);if(!t){toast('No suitable table is free for that time slot. Add guest to waiting list or try another time.');return}let r={id:uid('R',db.reservations),customerId:cid,tableId:t.id,start,end,party,status:'BOOKED',notes:f.get('notes')};db.reservations.push(r);log('Reservation created',r.id+' assigned to table '+t.no);save();render();toast('Reservation saved: '+r.id+' · Table '+t.no)};
if($('#resSearch')){let refresh=()=>$('#resTable').innerHTML=reservationRows();$('#resSearch').oninput=refresh;$('#resFilter').onchange=refresh}
$$('[data-seat]').forEach(b=>b.onclick=()=>{let r=db.reservations.find(x=>x.id===b.dataset.seat);if(r){r.status='SEATED';let t=db.tables.find(x=>x.id===r.tableId);if(t)t.status='OCCUPIED';log('Guest seated',r.id);save();render();toast('Guest seated at table.')}})
$$('[data-cancelres]').forEach(b=>b.onclick=()=>{let r=db.reservations.find(x=>x.id===b.dataset.cancelres);if(r){r.status='CANCELLED';log('Reservation cancelled',r.id);save();render()}})
$$('[data-finishres]').forEach(b=>b.onclick=()=>{let r=db.reservations.find(x=>x.id===b.dataset.finishres);if(r){r.status='DONE';let t=db.tables.find(x=>x.id===r.tableId);if(t)t.status='AVAILABLE';log('Reservation finished',r.id);save();render()}})
if($('#waitForm'))$('#waitForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);db.waitlist.push({id:uid('W',db.waitlist),name:f.get('name'),phone:f.get('phone'),party:Number(f.get('party')),notes:f.get('notes'),time:new Date().toLocaleString(),status:'WAITING'});log('Guest added to waiting list',f.get('name'));save();render();toast('Guest added to waiting list.')};
$$('[data-seatwait]').forEach(b=>b.onclick=()=>{let w=db.waitlist.find(x=>x.id===b.dataset.seatwait),t=fitTable(w.party,new Date().toISOString().slice(0,16),new Date(Date.now()+90*60000).toISOString().slice(0,16));if(!t){toast('No suitable table is free right now.');return}let c={id:uid('C',db.customers),name:w.name,phone:w.phone,email:''};db.customers.push(c);let start=new Date().toISOString().slice(0,16),end=new Date(Date.now()+90*60000).toISOString().slice(0,16);db.reservations.push({id:uid('R',db.reservations),customerId:c.id,tableId:t.id,start,end,party:w.party,status:'SEATED',notes:w.notes});t.status='OCCUPIED';w.status='SEATED';log('Waitlist guest seated',w.name+' at table '+t.no);save();render();toast('Guest seated at table '+t.no)});
$$('[data-removewait]').forEach(b=>b.onclick=()=>{let w=db.waitlist.find(x=>x.id===b.dataset.removewait);if(w)w.status='REMOVED';save();render()});
$$('[data-table-status]').forEach(s=>s.onchange=()=>{let t=db.tables.find(x=>x.id===s.dataset.tableStatus);t.status=s.value;log('Table status changed','Table '+t.no+' → '+s.value);save();render()});
$$('[data-deletetable]').forEach(b=>b.onclick=()=>{if(db.reservations.some(r=>r.tableId===b.dataset.deletetable&&['BOOKED','SEATED'].includes(r.status))){toast('Cannot remove a table with active reservations.');return}db.tables=db.tables.filter(t=>t.id!==b.dataset.deletetable);save();render()});
$$('[data-action="addtable"]').forEach(b=>b.onclick=()=>{let no=prompt('Table number?');if(!no)return;let cap=Number(prompt('Table capacity?', '4'));if(!cap||cap<1)return;db.tables.push({id:uid('T',db.tables),no,capacity:cap,status:'AVAILABLE'});log('Table added','Table '+no);save();render()});
if($('#menuSearch')){let refresh=()=>$('#menuCards').innerHTML=menuCards();$('#menuSearch').oninput=refresh;$('#menuCategory').onchange=refresh;$('#menuAvail').onchange=refresh}
$$('[data-togglemenu]').forEach(b=>b.onclick=()=>{let m=db.menu.find(x=>x.id===b.dataset.togglemenu);m.available=!m.available;log('Menu availability changed',m.name+' → '+m.available);save();render()});
$$('[data-action="addmenu"]').forEach(b=>b.onclick=()=>{let name=prompt('Dish name?');if(!name)return;let price=Number(prompt('Price in ₹?','150'));if(!price||price<0)return;let category=prompt('Category? ('+db.categories.join(', ')+')',db.categories[0])||db.categories[0];if(!db.categories.includes(category))db.categories.push(category);db.menu.push({id:uid('M',db.menu),name,category,price,available:true,emoji:'🍽️'});log('Menu item added',name);save();render()});
$$('[data-editmenu]').forEach(b=>b.onclick=()=>{let m=db.menu.find(x=>x.id===b.dataset.editmenu),p=prompt('Update price for '+m.name,m.price);if(p===null)return;if(Number(p)<0||p.trim()==='')return;let n=prompt('Update dish name',m.name);m.price=Number(p);if(n)m.name=n;log('Menu item edited',m.name);save();render()});
let cartItems=[];
function cartRender(){if(!$('#cartPreview'))return;$('#cartPreview').innerHTML=cartItems.length?cartItems.map((i,n)=>`${esc(db.menu.find(m=>m.id===i.itemId)?.name||'Dish')} × ${i.qty} — ${money(i.qty*i.price)} <button type="button" class="small danger" data-cart-remove="${n}">×</button>`).join('<br>')+'<hr><strong>Subtotal: '+money(cartItems.reduce((s,i)=>s+i.qty*i.price,0))+'</strong>':'No dishes added yet.';$$('[data-cart-remove]').forEach(b=>b.onclick=()=>{cartItems.splice(Number(b.dataset.cartRemove),1);cartRender()})}
if($('#addCart'))$('#addCart').onclick=()=>{let m=db.menu.find(x=>x.id===$('#orderDish').value),q=Number($('#orderQty').value);if(!m||q<1){toast('Choose an available dish and quantity.');return}let old=cartItems.find(i=>i.itemId===m.id);if(old)old.qty+=q;else cartItems.push({itemId:m.id,qty:q,price:m.price});cartRender()};
if($('#orderForm'))$('#orderForm').onsubmit=e=>{e.preventDefault();if(!cartItems.length){toast('Add at least one dish first.');return}let f=new FormData(e.target),items=cartItems.map(i=>({...i})),o={id:uid('O',db.orders),tableId:f.get('table'),reservationId:f.get('reservation'),staffId:f.get('staff'),items,status:'PLACED',time:new Date().toLocaleString()};db.orders.push(o);let t=db.tables.find(x=>x.id===o.tableId);if(t)t.status='OCCUPIED';items.forEach(it=>{db.recipes.filter(r=>r.itemId===it.itemId).forEach(r=>{let ing=db.ingredients.find(i=>i.id===r.ingredientId);if(ing)ing.stock=Math.max(0,Number((ing.stock-r.qty*it.qty).toFixed(2)))})});if(o.reservationId){let r=db.reservations.find(r=>r.id===o.reservationId);if(r)r.status='SEATED'}log('Order placed',o.id+' for table '+(t?.no||''));cartItems=[];save();render();toast('Order placed and sent to kitchen.')};
if($('#orderFilter'))$('#orderFilter').onchange=()=>$('#orderRows').innerHTML=orderRows();
$$('[data-order-status]').forEach(s=>s.onchange=()=>{let o=db.orders.find(x=>x.id===s.dataset.orderStatus);o.status=s.value;log('Kitchen status updated',o.id+' → '+o.status);save();render();toast('Kitchen status updated.')});
$$('[data-billorder]').forEach(b=>b.onclick=()=>{setPage('billing');setTimeout(()=>{if($('#billOrder')){$('#billOrder').value=b.dataset.billorder;previewBill()}},0)});
function billCalc(orderId,code){let o=db.orders.find(x=>x.id===orderId);if(!o)return null;let subtotal=o.items.reduce((s,i)=>s+i.qty*i.price,0),coupon=db.coupons.find(c=>c.code.toLowerCase()===String(code||'').trim().toLowerCase()&&c.active),discount=0,msg='';if(code&&coupon){if(subtotal>=coupon.min){discount=coupon.type==='percent'?subtotal*coupon.value/100:coupon.value;discount=Math.min(subtotal,discount)}else msg='Coupon minimum subtotal is '+money(coupon.min)}else if(code)msg='Coupon code not found or inactive';let base=subtotal-discount,gst=base*db.settings.gst/100,service=base*db.settings.service/100;return {o,subtotal,discount,gst,service,total:base+gst+service,msg,coupon:coupon&&discount?coupon.code:''}}
function previewBill(){if(!$('#billPreview'))return;let v=billCalc($('#billOrder')?.value,$('#billForm [name=coupon]')?.value);$('#billPreview').innerHTML=v?`Subtotal: <strong>${money(v.subtotal)}</strong><br>Discount: −${money(v.discount)} ${v.coupon?'('+esc(v.coupon)+')':''}<br>GST (${db.settings.gst}%): ${money(v.gst)}<br>Service (${db.settings.service}%): ${money(v.service)}<hr>Total: <strong>${money(v.total)}</strong>${v.msg?'<br><span style="color:var(--red)">'+esc(v.msg)+'</span>':''}`:'No unpaid orders available.'}
if($('#billOrder'))$('#billOrder').onchange=previewBill;if($('#billForm [name=coupon]'))$('#billForm [name=coupon]').oninput=previewBill;
if($('#billForm'))$('#billForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),v=billCalc(f.get('order'),f.get('coupon'));if(!v){toast('No valid order selected.');return}if(db.bills.some(b=>b.orderId===v.o.id&&b.status==='UNPAID')){toast('An unpaid bill already exists for this order.');return}let b={id:uid('B',db.bills),orderId:v.o.id,subtotal:v.subtotal,discount:v.discount,gst:v.gst,service:v.service,total:v.total,status:'UNPAID',coupon:v.coupon,createdAt:new Date().toLocaleString()};db.bills.push(b);log('Bill generated',b.id+' total '+money(b.total));save();render();toast('Bill '+b.id+' created.')};
$$('[data-paybill]').forEach(b=>b.onclick=()=>{let bill=db.bills.find(x=>x.id===b.dataset.paybill);if(!bill||bill.status==='PAID')return;let mode=$('#paymode-'+bill.id)?.value||'UPI';bill.status='PAID';bill.mode=mode;bill.paidAt=new Date().toLocaleString();db.payments.push({id:uid('P',db.payments),billId:bill.id,amount:bill.total,mode,time:new Date().toISOString()});let o=db.orders.find(x=>x.id===bill.orderId);if(o)o.status='SERVED';if(o){let t=db.tables.find(x=>x.id===o.tableId);if(t)t.status='AVAILABLE';if(o.reservationId){let r=db.reservations.find(x=>x.id===o.reservationId);if(r)r.status='DONE'}}log('Payment completed',bill.id+' paid by '+mode);save();render();toast('Payment recorded successfully.')});
if($('#couponForm'))$('#couponForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),code=f.get('code').trim().toUpperCase();if(db.coupons.some(c=>c.code.toUpperCase()===code)){toast('That coupon code already exists.');return}db.coupons.push({id:uid('CP',db.coupons),code,type:f.get('type'),value:Number(f.get('value')),min:Number(f.get('min')),active:true});log('Coupon created',code);save();render();toast('Coupon created.')};
$$('[data-coupon-toggle]').forEach(b=>b.onclick=()=>{let c=db.coupons.find(x=>x.id===b.dataset.couponToggle);c.active=!c.active;save();render()});
if($('#feedbackForm'))$('#feedbackForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);db.feedback.push({id:uid('F',db.feedback),name:f.get('name'),order:f.get('order'),rating:Number(f.get('rating')),comment:f.get('comment'),time:new Date().toLocaleString()});log('Feedback recorded',f.get('name')+' rated '+f.get('rating')+'/5');save();render();toast('Feedback saved.')};
if($('#staffForm'))$('#staffForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);db.staff.push({id:uid('S',db.staff),name:f.get('name'),role:f.get('role'),shift:f.get('shift')});log('Staff added',f.get('name')+' · '+f.get('role'));save();render();toast('Staff member added.')};
$$('[data-deletestaff]').forEach(b=>b.onclick=()=>{db.staff=db.staff.filter(s=>s.id!==b.dataset.deletestaff);save();render()});
$$('[data-restock]').forEach(b=>b.onclick=()=>{let i=db.ingredients.find(x=>x.id===b.dataset.restock),n=Number(prompt('Quantity to add ('+i.unit+')?','5'));if(n>0){i.stock=Number((i.stock+n).toFixed(2));log('Inventory restocked',i.name+' +'+n+' '+i.unit);save();render()}});
$$('[data-recipe]').forEach(b=>b.onclick=()=>{let i=db.ingredients.find(x=>x.id===b.dataset.recipe),m=prompt('Dish name to link with '+i.name+'?');if(!m)return;let item=db.menu.find(x=>x.name.toLowerCase()===m.toLowerCase());if(!item){toast('Dish not found in menu.');return}let qty=Number(prompt('Ingredient quantity per dish ('+i.unit+')?','0.1'));if(qty>0){db.recipes.push({itemId:item.id,ingredientId:i.id,qty});save();render()}});
$$('[data-action="addingredient"]').forEach(b=>b.onclick=()=>{let name=prompt('Ingredient name?');if(!name)return;let unit=prompt('Unit (kg, L, pcs)?','kg')||'kg',stock=Number(prompt('Current stock?', '0')),reorder=Number(prompt('Reorder level?', '2'));db.ingredients.push({id:uid('I',db.ingredients),name,unit,stock,reorder});log('Ingredient added',name);save();render()});
if($('#settingsForm'))$('#settingsForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);db.settings.restaurant=f.get('restaurant');db.settings.gst=Number(f.get('gst'));db.settings.service=Number(f.get('service'));log('Settings updated','Restaurant billing settings changed');save();render();toast('Settings saved.')};
if($('#exportData'))$('#exportData').onclick=()=>download('reservebite-backup.json',JSON.stringify(db,null,2),'application/json');
if($('#importData'))$('#importData').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let d=JSON.parse(await file.text());if(!d.tables||!d.menu||!d.reservations)throw Error('Invalid ReserveBite backup');db=d;save();render();toast('Backup restored.')}catch(err){toast('Could not import this file. Use a ReserveBite JSON backup.')}};
if($('#resetData'))$('#resetData').onclick=()=>{if(confirm('Reset all ReserveBite data to the original demo sample? This cannot be undone unless you exported a backup.')){db=structuredClone(defaults);save();log('Demo data reset','Restored default sample records');render();toast('Demo data reset.')}};
if($('#exportAudit'))$('#exportAudit').onclick=()=>download('reservebite-audit.csv','Time,Role,Action,Details\n'+db.audit.map(a=>[a.time,a.role,a.action,a.detail].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv');
}
function download(name,text,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type}));a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)setPage(b.dataset.page)});
$('#roleSwitch').onchange=e=>{role=e.target.value;$('#activeRole').textContent=role;log('Role switched','Active UI role: '+role);render()};
load();render();
</script>
</body>
</html>
